name: Enterprise QA Quality Gates & Reliability Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality-gates-pipeline:
    name: "Enterprise Multi-Layer Quality Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Start SUT Docker Services (PostgreSQL + REST API)
        run: |
          docker compose up -d --build postgres target-api
          echo "Waiting for SUT services to become healthy..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/health | grep -q "healthy"; then
              echo "✅ SUT API is healthy on port 5000!"
              break
            fi
            echo "Waiting for SUT API ($i/30)..."
            sleep 2
          done
          docker compose ps
          if ! curl -s http://127.0.0.1:5000/health | grep -q "healthy"; then
            echo "❌ SUT API failed to become healthy. Container logs:"
            docker compose logs
            exit 1
          fi

      # -----------------------------------------------------------------------
      # GATE 1: Fast Smoke & Connectivity SLA (< 10s)
      # -----------------------------------------------------------------------
      - name: "Gate 1: Fast Smoke & Platform Connectivity SLA"
        run: npx playwright test tests/smoke/platform-connectivity.spec.ts --reporter=list

      # -----------------------------------------------------------------------
      # GATE 2: API Contract & Database Invariant Validations
      # -----------------------------------------------------------------------
      - name: "Gate 2: API Contract & DB Invariant Validation"
        run: npx playwright test tests/api tests/database --reporter=list

      # -----------------------------------------------------------------------
      # GATE 3: UI End-to-End User Journeys (Page Object Model)
      # -----------------------------------------------------------------------
      - name: "Gate 3: UI E2E User Journey & POM Validation"
        run: npx playwright test tests/ui --reporter=list

      # -----------------------------------------------------------------------
      # GATE 4: Concurrency & SLA Performance Benchmark
      # -----------------------------------------------------------------------
      - name: "Gate 4: Concurrency & SLA Performance Load Benchmark"
        run: npm run test:perf

      # -----------------------------------------------------------------------
      # Telemetry Ingestion & TestOps Artifacts
      # -----------------------------------------------------------------------
      - name: Ingest Test Metrics to PostgreSQL Warehouse
        if: always()
        run: npm run metrics:ingest || true

      - name: Upload Playwright Trace & HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report
          path: playwright-report/
          retention-days: 14
