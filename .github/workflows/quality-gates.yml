name: Enterprise QA Quality Gates & Reliability Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # =========================================================================
  # STAGE 1: Fast Smoke Quality Gate (Fail-Fast within 60 seconds)
  # =========================================================================
  smoke-quality-gate:
    name: "Gate 1: Fast Smoke & Connectivity SLA"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium Only)
        run: npx playwright install --with-deps chromium

      - name: Start SUT Containers (Postgres + Target API)
        run: |
          docker compose up -d postgres target-api
          echo "Waiting for services to become healthy..."
          timeout 60 bash -c 'until docker compose ps | grep "qa_target_api" | grep "healthy"; do sleep 2; done' || true
          docker compose ps

      - name: Execute Fast Smoke Gate
        run: npx playwright test tests/smoke/platform-connectivity.spec.ts --reporter=list

  # =========================================================================
  # STAGE 2: API Contract & Database Invariant Gate
  # =========================================================================
  api-database-gate:
    name: "Gate 2: API Contract & DB Invariant Validation"
    needs: smoke-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Start SUT Containers
        run: |
          docker compose up -d postgres target-api
          timeout 60 bash -c 'until docker compose ps | grep "qa_target_api" | grep "healthy"; do sleep 2; done' || true
          docker compose ps

      - name: Execute API & Database Test Suites
        run: |
          npx playwright test tests/api tests/database --reporter=list,json:reports/test-results.json

      - name: Ingest Test Metrics to PostgreSQL Warehouse
        if: always()
        run: |
          npm run metrics:ingest || true

  # =========================================================================
  # STAGE 3: UI End-to-End User Experience Gate
  # =========================================================================
  ui-e2e-gate:
    name: "Gate 3: UI E2E User Journey & POM Validation"
    needs: smoke-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium Only)
        run: npx playwright install --with-deps chromium

      - name: Execute UI E2E Journey Tests
        run: |
          npx playwright test tests/ui --reporter=list,html:playwright-report

      - name: Upload Playwright Trace & HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report
          path: playwright-report/
          retention-days: 14

  # =========================================================================
  # STAGE 4: Automated Quality Gate Verdict & Telemetry
  # =========================================================================
  quality-gate-verdict:
    name: "Gate 4: Automated Quality Gate Verdict"
    needs: [api-database-gate, ui-e2e-gate]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Evaluate Multi-Layer Pipeline Verdict
        run: |
          if [ "${{ needs.api-database-gate.result }}" != "success" ] || [ "${{ needs.ui-e2e-gate.result }}" != "success" ]; then
            echo "❌ QUALITY GATE FAILED: One or more test layers did not meet reliability criteria."
            echo "API/Database Gate: ${{ needs.api-database-gate.result }}"
            echo "UI E2E Gate: ${{ needs.ui-e2e-gate.result }}"
            exit 1
          fi
          echo "✅ QUALITY GATE PASSED: All 48 multi-layer validations (UI, API, DB) satisfied strict reliability criteria."
