services:
  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: qa_postgres
    environment:
      POSTGRES_DB: qa_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d qa_db"]
      interval: 3s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Target REST API SUT ─────────────────────────────────────
  target-api:
    build:
      context: ./sut
      dockerfile: Dockerfile
    container_name: qa_target_api
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://admin:password@postgres:5432/qa_db
      JWT_SECRET: qa-platform-super-secret-key-at-least-32-chars
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health | grep healthy || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 192m

  # ── Grafana Observability Dashboard ─────────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: qa_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres-data:
